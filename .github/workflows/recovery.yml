name: RECOVERY

on:
  workflow_dispatch:
    inputs:
      RECOVERY_URL:
        description: 'RECOVERY URL'
        required: true
        default: 'https://files.catbox.moe/(RECOMMENDED)'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Check Out
      uses: actions/checkout@v4

    - name: Fix Line Endings and Permissions
      run: |
        sed -i -e 's/\r$//' script1.sh script2.sh avbtool 2>/dev/null || true
        chmod +x script1.sh script2.sh avbtool

    - name: Prepare the environment and fetch latest magiskboot
      run: |
        sudo apt update
        sudo apt install -y git wget lz4 tar openssl python3 cpio lib32stdc++6 unzip
        
        # Download the latest Magisk release zip to extract a fresh, compatible magiskboot binary
        wget https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk -O magisk.zip
        unzip -o magisk.zip 'lib/x86_64/libmagiskboot.so'
        mv lib/x86_64/libmagiskboot.so ./magiskboot
        chmod +x magiskboot
        rm -rf magisk.zip lib

    - name: Fetch image from URL
      run: |
        wget "${{ github.event.inputs.RECOVERY_URL }}" -O recovery.img

    - name: Patch Process-1
      run: |
        set -x
        ./script1.sh recovery.img

    - name: Patch Process-2
      run: |
        set -x
        ./script2.sh
        
        # Ensure the repacked image matches what avbtool expects
        if [ -f "new-boot.img" ]; then
          cp new-boot.img recovery-patched.img
        elif [ -f "r-patched.img" ]; then
          cp r-patched.img recovery-patched.img
        fi

        python3 avbtool extract_public_key --key phh.pem --output phh.pub.bin
        python3 avbtool add_hash_footer --partition_name recovery --partition_size $(wc -c recovery.img | cut -f 1 -d ' ') --image recovery-patched.img --key phh.pem --algorithm SHA256_RSA4096
        
        mkdir -p output && cd output
        mv ../recovery-patched.img recovery.img
        tar cvf fastbootd-recovery.tar recovery.img
        md5sum -t fastbootd-recovery.tar > fastbootd-recovery.tar.md5

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        files: output/*.md5
        name: Patched-Recovery
        tag_name: ${{ github.run_id }}
